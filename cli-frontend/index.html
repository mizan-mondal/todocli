<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="todocli - Minimalist Terminal Task Manager">
  <title>todocli</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal-screen" id="terminal-screen">
    <!-- ASCII Letter Logo -->
    <pre class="ascii-logo" aria-label="todocli logo">
  _            _            _ _ 
 | |_ ___   __| | ___   ___| (_)
 | __/ _ \ / _` |/ _ \ / __| | |
 | || (_) | (_| | (_) | (__| | |
  \__\___/ \__,_|\___/ \___|_|_|
    </pre>

    <!-- Terminal History / Output Area -->
    <div class="terminal-history" id="terminal-history" role="log" aria-live="polite"></div>

    <!-- Active Input Line -->
    <div class="prompt-line" id="prompt-line">
      <span class="prompt-text"><span class="prompt-user" id="prompt-user">todocli</span>:<span class="prompt-path">~</span>$</span>
      <div class="cli-input-wrapper">
        <span class="cli-input-display" id="cli-input-display" aria-hidden="true"></span>
        <input 
          type="text" 
          id="cli-input" 
          class="cli-input" 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false" 
          aria-label="Terminal command input"
          autofocus
        >
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
